services:
  video-lenspro-backend:
    # image: video-lenspro-backend:${VIDEO_VERSION}
    build:
      context: ./backend
    container_name: video-lenspro-backend
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    # environment:
    #   - REDIS_URL=redis://redis:6379
    volumes:
      - ./Data/AI_logs/:/app/AI_logs
      - ./Data/huggingface-cache:/app/models/huggingface
      - ./Data/torch-cache:/app/models/torch
      - ./Data/temp_storage:/tmp/video_processing
    depends_on:
      chromadb:
        condition: service_started
    networks:
      - app-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      timeout: 5s
      retries: 3
      start_period: 20s

  frontend:
    # image: video-lenspro-frontend:${FRONTEND_VERSION}
    build:
      context: ./frontend
    container_name: video-lenspro-frontend
    ports:
      - "9000:9000"
    depends_on:
      video-lenspro-backend:
        condition: service_healthy
    networks:
      - app-network
    restart: unless-stopped
  
  chromadb:
    image: chromadb/chroma:0.4.24
    container_name: chromadb
    ports:
      - "8002:8000"
    volumes:
      - ./Data/chroma_db:/chroma/chroma
    networks:
      - app-network
    restart: unless-stopped
    
  # redis:
